services:
  traefik:
    image: traefik:v3.6
    networks:
      - traefik_proxy
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/letsencrypt:rw
    command:
      # Puntos de entrada (SIN REDIRECCIÓN GLOBAL)
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Proveedor Swarm
      - "--providers.swarm=true"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.exposedbydefault=false"

      # Logs (cambiar a DEBUG temporalmente)
      - "--log.level=DEBUG"
      - "--accesslog=true"

      # Configuración de Let's Encrypt (ACME)
      - "--certificatesresolvers.myresolver.acme.email=sistemas@dwitmexico.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"

      # API & Dashboard (opcional para debug)
      - "--api.dashboard=true"
      - "--api.insecure=true"

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role==manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        # Dashboard de Traefik (temporal para debug)
        - "traefik.enable=true"
        - "traefik.http.routers.dashboard.rule=Host(`traefik.guz-studio.dev`)"
        - "traefik.http.routers.dashboard.entrypoints=websecure"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.tls=true"
        - "traefik.http.routers.dashboard.tls.certresolver=myresolver"
        - "traefik.http.services.dashboard.loadbalancer.server.port=8080"

networks:
  traefik_proxy:
    external: true
    name: traefik_proxy

volumes:
  traefik_acme:
