    - name: Start Docker
      become: yes
      shell: systemctl enable docker && systemctl start docker

    - name: Check status Docker
      become: yes
      shell: systemctl status docker
      register: docker_status
      ignore_errors: yes

    - name: Display Docker status
      debug:
        var: docker_status.stdout_lines

    - name: Check if swarm is already initialized
      become: yes
      shell: docker info --format '{% raw %}{{.Swarm.LocalNodeState}}{% endraw %}'
      register: swarm_status
      ignore_errors: yes

    - name: Install Docker Swarm
      become: yes
      shell: docker swarm init
      when: swarm_status.stdout != "active"
      ignore_errors: yes

    - name: Check Docker Swarm status
      become: yes
      shell: docker node ls
      register: swarm_nodes
      ignore_errors: yes

    - name: Display Swarm nodes
      debug:
        var: swarm_nodes.stdout_lines

    - name: Create overlay network traefik
      become: yes
      shell: docker network create --driver overlay --attachable traefik_proxy || true

    - name: Create user infra_devops with folder /home/infra_devops
      become: yes
      user:
        name: infra_devops
        state: present
        shell: /bin/bash
        createhome: true

    - name: Add user infra_devops to docker group
      become: yes
      user:
        name: infra_devops
        groups: docker
        append: true

    - name: Ensure .ssh directory exists for infra_devops user
      become: yes
      file:
        path: /home/infra_devops/.ssh
        state: directory
        owner: infra_devops
        group: infra_devops
        mode: 0700

    - name: Copy ssh key public to infra_devops user
      become: yes
      copy:
        src: ~/.ssh/vps.pub
        dest: /home/infra_devops/.ssh/authorized_keys
        owner: infra_devops
        group: infra_devops
        mode: 0600

    - name: Get traefik deployment YAML file
      delegate_to: localhost
      shell: cd ../../swarm && cat ./traefik.yml
      register: script

    - name: Write the Traefik deployment YAML file to a temporary file on localhost
      delegate_to: localhost
      copy:
        content: "{{ script.stdout }}"
        dest: /tmp/traefik.deployment.yml

    - name: Transfer the YAML file to the remote server
      become: yes
      copy:
        src: /tmp/traefik.deployment.yml
        dest: /tmp/traefik.deployment.yml

    - name: Execute docker stack deploy using the temporary file
      become: yes
      shell: docker stack deploy -c /tmp/traefik.deployment.yml traefik
      register: stack_deploy_result

    - name: Display stack deploy result
      debug:
        var: stack_deploy_result

    - name: Wait for Traefik service to be created
      become: yes
      shell: docker service ls --filter name=traefik
      register: service_check
      until: service_check.stdout.find("traefik") != -1
      retries: 10
      delay: 5

    - name: Check Traefik service status
      become: yes
      shell: docker service ps traefik_traefik --no-trunc
      register: traefik_service_status

    - name: Display Traefik service status
      debug:
        var: traefik_service_status.stdout_lines

    - name: Check if Traefik service is running
      become: yes
      shell: docker service inspect --format "{{.Spec.TaskTemplate.ContainerSpec.Image}} {{.Spec.Mode.Replicated.Replicas}}" traefik_traefik
      register: traefik_inspect
      ignore_errors: yes

    - name: Display Traefik service info
      debug:
        var: traefik_inspect.stdout

    - name: Get Traefik container logs
      become: yes
      shell: docker service logs traefik_traefik --tail 50
      register: traefik_logs
      ignore_errors: yes

    - name: Display Traefik logs
      debug:
        var: traefik_logs.stdout_lines

    - name: List all stacks
      become: yes
      shell: docker stack ls
      register: stack_list

    - name: Display stack list
      debug:
        var: stack_list.stdout_lines

    - name: List all services
      become: yes
      shell: docker service ls
      register: service_list

    - name: Display service list
      debug:
        var: service_list.stdout_lines

    - name: Ensure the temporary YAML file is removed from the remote server
      become: yes
      file:
        path: /tmp/traefik.deployment.yml
        state: absent
      ignore_errors: true

    - name: Ensure the temporary YAML file is removed from localhost
      delegate_to: localhost
      file:
        path: /tmp/traefik.deployment.yml
        state: absent
      ignore_errors: true
